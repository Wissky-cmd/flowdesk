name: flowdesk
x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &environment
    DATABASE_URL: postgresql+psycopg://flowdesk:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/flowdesk
    REDIS_URL: redis://redis:6379/0
    BROKER_URL: redis://redis:6379/1
    RATE_LIMIT_ENABLED: 'true'
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080"]}
    EXPORT_DIR: /data/exports
  volumes:
    - exports:/data/exports
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: flowdesk
      POSTGRES_USER: flowdesk_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-flowdesk.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U flowdesk_admin -d flowdesk']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: [python, -m, alembic, -c, backend/alembic.ini, upgrade, head]
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    <<: *app
    command: [celery, -A, app.worker:celery, worker, --loglevel=INFO, --concurrency=2]
  dispatcher:
    <<: *app
    command: [python, -m, app.dispatcher]
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ['127.0.0.1:8080:80']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  redis:
  exports:
